<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <title>PetWalk - Perfil da Mel</title>

<body>
  <header class="app-header">
    <a class="back-btn" href="perfil-pets.html" aria-label="Voltar">‹</a>
    <h1>Perfil</h1>
  </header>

  <main>
    <div class="container-pad">
      <a class="card-link" href="adicionar-pet.html" aria-label="Editar pet">
        <div class="walker-card">
          <div class="walker-left">
            <div class="avatar-wrap">
              <img class="avatar" src="img/avatar1.svg" alt="Mel">
            </div>
            <div class="walker-info">
              <div class="walker-name">Mel <span class="small">4 anos · Médio</span></div>
              <div class="verified">Border Collie · Preto e Branco</div>
            </div>
          </div>
        </div>
      </a>

      <section class="details-section">
        <h3>Detalhes</h3>
        <p><strong>Comportamento:</strong> Amigável</p>
        <p><strong>Observações:</strong> Precisa de guia sempre. Tem medo de fogos de artifício.</p>

        <div class="action-row">
          <a class="btn primary" href="adicionar-pet.html">Editar</a>
          <a class="btn" href="perfil-pets.html">Voltar</a>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav">

      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span>Início</span>
    </a>
    <a class="nav-item" href="conversas.html">
      <span class="nav-icon" aria-hidden="true">💬</span>
      <span>Chat</span>
    </a>
    <a class="nav-item active" href="perfil-pets.html">
      <span class="nav-icon" aria-hidden="true">👤</span>
      <span>Perfil</span>
    </a>
  </nav>
