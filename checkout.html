<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <title>PetWalk - Checkout</title>
</head>
<body>
  <header class="app-header">
    <a class="back-btn" href="horarios.html" aria-label="Voltar">‹</a>
    <h1>Checkout</h1>
  </header>

  <main>
    <div class="container-pad">
      <div class="walker-card">
        <div class="walker-left">
          <div class="avatar-wrap">
            <img class="avatar" src="img/avatar1.svg" alt="Carla">
          </div>
          <div class="walker-info">
            <div class="walker-name">Carla <span class="small">★★★★★</span></div>
            <div class="verified">Passeadora</div>
          </div>
        </div>
        <div class="price">R$35</div>
      </div>

      <section class="details-section">
        <h3>Resumo do pedido</h3>
        <div class="summary-card">
          <ul class="summary-list">
            <li class="summary-item"><span class="label">Serviço</span><span class="value">Passeio (1h)</span></li>
            <li class="summary-item"><span class="label">Pet</span><span class="value">Mel</span></li>
            <li class="summary-item"><span class="label">Data</span><span class="value">Hoje, 10/03</span></li>
            <li class="summary-item"><span class="label">Horário</span><span class="value">14:00 — 15:00</span></li>
          </ul>
        </div>

        <h3 class="section">Pagamento</h3>
        <div class="summary-card">
          <ul class="summary-list">
            <li class="summary-item"><span class="label">Passeio (1h)</span><span class="value">R$ 35,00</span></li>
            <li class="summary-item"><span class="label">Taxa de serviço</span><span class="value">R$ 3,50</span></li>
            <li class="summary-total"><span class="label">Total</span><span class="value">R$ 38,50</span></li>
          </ul>
        </div>

        <div class="action-row">
          <a class="btn primary" href="confirmacao.html">Confirmar R$ 38,50</a>
          <a class="btn" href="horarios.html">Voltar</a>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="configuracoes.html">
      <span class="nav-icon" aria-hidden="true">⚙️</span>
      <span>Config.</span>
    </a>
    <a class="nav-item" href="buscar-walkers.html">
      <span class="nav-icon" aria-hidden="true">🔍</span>
      <span>Buscar</span>
    </a>
    <a class="nav-item active" href="index.html">
      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span>Início</span>
    </a>
    <a class="nav-item" href="conversas.html">
      <span class="nav-icon" aria-hidden="true">💬</span>
      <span>Chat</span>
    </a>
    <a class="nav-item" href="perfil-pets.html">
      <span class="nav-icon" aria-hidden="true">👤</span>
      <span>Perfil</span>
    </a>
  </nav>
</body>
</html>
